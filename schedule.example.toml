# ~/.config/streamrec/schedule.toml
# The scheduler re-reads this file every 15 s, so just edit and save; no restart needed.
# Check it with:  streamrec.py schedule --check
# `streamrec add/remove/page` and the web page edit this file too; they keep your comments.

[defaults]            # applied to every stream; any `record` option works (--part -> part)
mode = "auto"         # auto | grab | screen
part = "5m"
lead = 3              # minutes before start to begin trying
# rclone = "gdrive:streams"
# extension = "~/uBOLite"
# inhibit_sleep = true   # stop the computer suspending while recording (desktop/laptop)

[[stream]]
name  = "keynote"                       # folder name (optional)
url   = "https://example.com/live"
start = 2026-11-25T21:00:00             # local time; a full date is required
end   = 2026-11-25T23:30:00             # pad it: it keeps retrying until then

[[stream]]
url      = "https://example.org/watch?id=123"
start    = 2026-11-28T09:00:00
duration = "3h"                         # instead of end
mode     = "screen"                     # per-stream override

# Saved stream pages: give a URL a name once, then use `page = "channel 1"` instead of url.
[[page]]
name = "channel 1"
url  = "https://example.net/live/1"

[[stream]]
page  = "channel 1"
start = 2026-11-30T20:00:00
end   = 2026-11-30T22:30:00

# SofaScore (optional). Find ids with: streamrec sofa search "team name"
# Matches start recording 10 min before kickoff and follow kickoff changes and postponements;
# they end 10 min after the final whistle (at most 4 h after kickoff).
# [sofascore]
# lead = 10
# after = 10
# max_hours = 4
#
# [[follow]]
# team = 5981               # or: tournament = 325
# name = "Flamengo"
# page = "channel 1"        # where its matches are recorded (or url = "...")
# auto = true               # schedule every match automatically
